name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test the check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./test/check-ai-attribution-test.sh

  action:
    name: Run the action
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
